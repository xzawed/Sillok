# Sillok 로컬 스택 (D13: Postgres + Service 두 개)
#
# 정본: adr/0001-v1-stack-decisions.md — 값이 다르면 정본이 이긴다.
# 작업 순서: docs/plan.md §7. db 는 1단계, api 는 3단계에서 붙었다.
#
# 5432 를 호스트에 게시하지 않는다 (D16). 디버깅으로 호스트에서 붙어야 하면
# compose.override.example.yml 를 compose.override.yml 로 복사해서 쓴다.

services:
  db:
    # 확장 파일이 들어 있는 이미지를 쓴다. 이미지가 있어도 DB 마다
    # CREATE EXTENSION 은 따로 필요하다 — migrations/001_extensions.sql (D17).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sillok}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sillok}
      POSTGRES_DB: ${POSTGRES_DB:-sillok}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # --wait 가 이 검사를 본다. pg_isready 만으로는 초기화 중인 DB 도 통과하므로
      # 실제 접속까지 확인한다.
      # $$ 로 이스케이프해서 Compose 가 아니라 컨테이너 셸이 풀게 한다.
      # 그래야 environment: 를 오버라이드로 바꿔도 검사가 같은 값을 따라간다.
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
          && psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -c 'SELECT 1' >/dev/null
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      # **반드시 명시한다.** Dockerfile 이 다단계라 생략하면 마지막 스테이지(test)가
      # api 이미지가 되어 pytest 가 운영 이미지로 들어간다 (D22).
      target: runtime
    depends_on:
      db:
        condition: service_healthy
    environment:
      # D16. 컨테이너 안에서는 호스트가 db 이고 bind 는 0.0.0.0 이어야
      # 호스트의 127.0.0.1:8080 에 닿는다.
      DATABASE_URL: postgresql://${POSTGRES_USER:-sillok}:${POSTGRES_PASSWORD:-sillok}@db:5432/${POSTGRES_DB:-sillok}
      SILLOK_HOST: 0.0.0.0
      SILLOK_PORT: 8080
      SILLOK_WORKSPACE: /workspace
      SILLOK_BEARER_TOKEN: ${SILLOK_BEARER_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      # 8080 은 게시한다. 이것이 Service 의 문이다 (D16 이 막는 것은 5432 다).
      - "127.0.0.1:8080:8080"
    volumes:
      # get_file 은 7단계지만 workspace 계약은 D16 이 이미 정했다. 읽기 전용.
      - .:/workspace:ro
    healthcheck:
      # 포트가 열렸는지가 아니라 **업무 라우트가 실제로 답하는지**를 본다.
      # 4단계에서 GET /v1/status 가 생겼으므로 약속대로 옮겼다 (그전에는 없는 경로의 404 봉투를 봤다).
      # 이제 DB 까지 살아 있어야 healthy 다 — api 는 DB 없이 할 수 있는 일이 없고
      # D17 이 이미 마이그레이션 없이는 뜨지 않게 해 두었다.
      #
      # SILLOK_BEARER_TOKEN 이 설정되면 D7 게이트가 켜진다. 검사도 토큰을 보내야 한다 —
      # 안 보내면 자기 게이트에 401 로 막혀 컨테이너가 영원히 unhealthy 가 되고
      # up --wait 이 실패한다 (실측으로 확인).
      test:
        - CMD
        - python
        - -c
        - >-
          import http.client as h,os,sys;
          t=os.environ.get('SILLOK_BEARER_TOKEN','');
          c=h.HTTPConnection('127.0.0.1',8080,timeout=3);
          c.request('GET','/v1/status?project=healthcheck',
          headers={'Authorization':'Bearer '+t} if t else {});
          r=c.getresponse();
          sys.exit(0 if r.status==200 and b'"ok":true' in r.read() else 1)
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # D22: DB 검사를 커밋된 구성에서 돌린다.
  #   docker compose --profile test run --rm test
  # profiles 가 붙어 있으므로 기본 `docker compose up` 에는 나타나지 않는다 —
  # 그래서 D13 의 "두 개"(기본 up 의 제품 스택)를 어기지 않는다.
  # ports 를 붙이거나 profiles 를 빼면 그 순간 D13 개정이 필요하다.
  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    depends_on:
      db:
        condition: service_healthy
    environment:
      # api 와 같은 방식으로 내부 네트워크의 db 에 붙는다. 5432 는 계속 닫혀 있다 (D16).
      DATABASE_URL: postgresql://${POSTGRES_USER:-sillok}:${POSTGRES_PASSWORD:-sillok}@db:5432/${POSTGRES_DB:-sillok}
    volumes:
      # D28. Dockerfile 의 test 스테이지가 소스를 굽지만 compose run 은 이미지가 있으면
      # 다시 만들지 않는다. 마운트하지 않으면 **새로 쓴 검사가 없는 옛 이미지가 통과로 보고한다** —
      # 실패가 아니라 통과로 나오므로 조용하다. 읽기 전용이라 검사가 작업 트리를 고치지 못한다.
      # .venv 는 이미지에 남는다. 의존성을 바꾸면 다시 빌드해야 하고 그때는 ImportError 로 시끄럽게 죽는다.
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      # D28 가 예고한 자리다 — "SQL 만 더하는 변경"이 오면 구운 migrations/ 가 조용히 낡는다.
      # 003 을 더한 뒤 실측하니 이미지 안에는 001·002 뿐이었고 검사는 그대로 통과했다.
      - ./migrations:/app/migrations:ro
      # D16 의 사본이다. 이미지에는 없으므로(.dockerignore) 마운트하지 않으면
      # 그 사본을 대조하는 검사가 컨테이너에서만 죽는다 — 실제로 그렇게 한 번 났다.
      - ./.env.example:/app/.env.example:ro

volumes:
  db_data:
