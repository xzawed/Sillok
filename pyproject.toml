[project]
name = "sillok"
version = "0.0.1"
description = "Git에는 현재 진실만, Postgres에는 사건 원장만 — 저장 위치를 강제하는 지식 원장"
# D18: CPython 3.12 고정. 범위를 두지 않는다.
requires-python = ">=3.12,<3.13"
dependencies = [
  "psycopg[binary]>=3.2",
]

[project.scripts]
# D17 의 마이그레이션 러너. D8 이 정한 CLI 두 개(serve, ingest)는
# docs/plan.md §7 의 3·5단계에서 붙는다.
sillok = "sillok.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sillok"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
