[project]
name = "sillok"
version = "0.0.1"
description = "Git에는 현재 진실만, Postgres에는 사건 원장만 — 저장 위치를 강제하는 지식 원장"
# D18: CPython 3.12 고정. 범위를 두지 않는다.
requires-python = ">=3.12,<3.13"
dependencies = [
  "psycopg[binary]>=3.2",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "openai>=3.6.0",
  "mcp>=2.1",
]

[project.scripts]
# D17 의 마이그레이션 러너. D8 이 정한 CLI 두 개(serve, ingest)는
# docs/plan.md §7 의 3·5단계에서 붙는다.
sillok = "sillok.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  # TestClient 가 요구한다. 앱 자체는 httpx 를 쓰지 않는다.
  "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sillok"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# addopts 에 -q 를 넣지 않는다. 문서가 시키는 `pytest -q` 와 겹치면 verbosity 가
# 두 번 내려가 **통과·skip 개수 줄이 사라진다.** AGENTS.md 는 그 개수를 증거로 요구하므로,
# 겹치는 순간 문서가 시키는 명령이 요구된 증거를 못 내게 된다 (감사에서 발견).
