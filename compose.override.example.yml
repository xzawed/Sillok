# 호스트에서 DB 에 직접 붙어야 할 때만 쓴다.
#
#   cp compose.override.example.yml compose.override.yml
#
# compose.override.yml 은 .gitignore 에 있다. 커밋하지 않는다.
#
# 왜 기본 compose 에 없는가: D16 이 5432 미게시를 정했다. Compose 위생이지
# D19 가 강제하는 것은 아니지만, 열어 두면 사람이 psql 로 들어오는 길이 상시 열린다.
#
# 언제 필요한가: 호스트에서 DB 에 붙어야 하는 두 가지.
#   uv run pytest      의 DB 검사 19개 (없으면 skip 된다 — Q26)
#   uv run sillok migrate
#
# 5단계에서 sillok ingest 가 생기면 색인은 `docker compose exec api sillok ingest ...` 로
# 컨테이너 안에서 부를 수 있다. **지금은 그 명령이 없다** (migrate, serve 뿐).
# **호스트에서** pytest 의 DB 검사를 돌릴 때만 이 오버라이드가 필요하다.
# 컨테이너 안에서 돌리는 길은 이미 있다 (D22): docker compose --profile test run --rm test
# 그쪽은 5432 를 열지 않고 내부 네트워크로 붙는다.

services:
  db:
    ports:
      # 127.0.0.1 에만 바인딩한다. 0.0.0.0 으로 열지 않는다.
      - "127.0.0.1:5432:5432"
